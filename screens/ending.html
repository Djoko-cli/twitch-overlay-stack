<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Ending — Liquid Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/liquid-glass.css">
<script src="../shared/scale.js"></script>
<style>
  body { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0713; }

  .card {
    position: relative; z-index: 1;
    width: min(90vw, 620px);
    padding: 56px 48px;
    border-radius: var(--radius-xl);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    text-align: center;
  }

  h1 { margin: 0; font-size: 40px; font-weight: 900; }
  .sub { margin: 0; font-size: 16px; color: var(--text-dim); font-weight: 600; }

  #socials { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .chip {
    padding: 8px 18px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 700;
    background: rgba(255,255,255,.1); border: 1px solid var(--glass-border-dim);
  }
</style>
</head>
<body>

<div class="blob-field">
  <div class="blob" style="width:44vw;height:44vw;top:-14%;left:10%;background:#E4002B;animation:float-c 12s ease-in-out infinite;"></div>
  <div class="blob" style="width:36vw;height:36vw;bottom:-12%;right:-4%;background:#00e5ff;animation:float-a 15s ease-in-out infinite;"></div>
  <div class="blob" style="width:30vw;height:30vw;top:30%;right:18%;background:#ff7a00;animation:float-b 18s ease-in-out infinite;"></div>
</div>

<div class="fringe-spin">
  <div class="card glass glass-strong">
    <h1 id="titleOut">Merci d'avoir regardé !</h1>
    <p class="sub" id="subOut">À la prochaine 👋</p>
    <div id="socials"></div>
  </div>
</div>

<script>
/* ---------- config via query string ------------------------------------
   ?title=Merci%20d%27avoir%20regard%C3%A9%20!
   ?sub=Texte%20libre
   ?twitter=pseudo   ?discord=lien   ?youtube=pseudo   ?tiktok=pseudo
   (chaque paramètre présent ajoute un chip)
-------------------------------------------------------------------------- */
const params = new URLSearchParams(location.search);
if (params.get('title')) document.getElementById('titleOut').textContent = params.get('title');
if (params.get('sub')) document.getElementById('subOut').textContent = params.get('sub');

const socials = document.getElementById('socials');
const map = { twitter: 'X / Twitter', discord: 'Discord', youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram' };
Object.entries(map).forEach(([key, label]) => {
  const val = params.get(key);
  if (!val) return;
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = `${label} · ${val}`;
  socials.appendChild(chip);
});
</script>
</body>
</html>
